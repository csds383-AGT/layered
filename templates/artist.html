<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Artist Catalog</title>
    <style>
        body {
            margin: 0;
            padding: 30px;
            background: linear-gradient(135deg, #4a5fd9 0%, #5a3d99 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .top-bar a {
            color: #4a5fd9;
            text-decoration: none;
            font-weight: 600;
        }

        /* Standard List Box Style */
        select.artist-listbox {
            width: 100%;
            height: 180px;
            padding: 8px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        button {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-add { background: #16a34a; color: white; }
        .btn-update { background: #4a5fd9; color: white; }
        .btn-delete { background: #dc2626; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <h2 style="margin: 0;">Artist Catalog</h2>
        <a href="/">← Go Back</a>
    </div>

    <!-- List Box showing all artists -->
    <select id="artistListBox" size="10" class="artist-listbox" onchange="populateForm()">
        {% for artist in artists %}
            <option value="{{ artist.id }}" 
                    data-name="{{ artist.name }}" 
                    data-contact="{{ artist.booking_contact or '' }}" 
                    data-events="{{ (artist.event_ids or []) | join(', ') }}">
                {{ artist.name }} (Contact: {{ artist.booking_contact or 'N/A' }})
            </option>
        {% endfor %}
    </select>

    <!-- Simple Form to Add / Edit Selected Artist -->
    <form id="artistForm">
        <input type="hidden" id="artistId">

        <div class="form-group">
            <label>Name</label>
            <input type="text" id="artistName" required placeholder="Artist name">
        </div>

        <div class="form-group">
            <label>Booking Contact</label>
            <input type="text" id="bookingContact" placeholder="Contact info">
        </div>

        <div class="form-group">
            <label>Event IDs (Comma-separated)</label>
