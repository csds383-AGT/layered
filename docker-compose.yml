services:
  db:
    build:
      context: .
      target: db
    environment:
      POSTGRES_USER: festhub
      POSTGRES_PASSWORD: festhub
      POSTGRES_DB: festhub
    ports:
      # ip:port on your machine : port inside the container
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "festhub"]
      interval: 2s
      retries: 15
    networks:
      - db_net

  logic:
    build:
      context: .
      target: logic
    environment:
      DATABASE_URL: postgresql://festhub:festhub@db:5432/festhub
    networks:
      - app_net
      - db_net
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    environment:
      BUSINESS_HOST: logic
      BUSINESS_PORT: "50051"
    ports:
      - "5001:5000"
    networks:
      - app_net
    depends_on:
      - logic

networks:
  app_net:
    driver: bridge
  db_net:
    driver: bridge
    internal: true

volumes:
  db-data:
