services:
  db:
    build: db
    environment:
      POSTGRES_USER: festhub
      POSTGRES_PASSWORD: festhub
      POSTGRES_DB: festhub
    ports:
      # ip:port on your machine : port inside the container
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "festhub"]
      interval: 2s
      retries: 15
    networks:
      - db_net

  logic:
    build:
      context: .
      dockerfile: logic/Dockerfile
    environment:
      DATABASE_URL: postgresql://festhub:festhub@db:5432/festhub
    networks:
      - app_net
      - db_net
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: logic
          target: /festhub/logic
        - action: sync+restart
          path: backend-server.py
          target: /festhub/backend-server.py
        - action: rebuild
          path: festhub.proto
        - action: rebuild
          path: requirements.txt

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      BUSINESS_HOST: logic
      BUSINESS_PORT: "50051"
      FLASK_DEBUG: "1"
    ports:
      - "127.0.0.1:5001:5000"
    networks:
      - app_net
    depends_on:
      - logic
    develop:
      watch:
        - action: sync
          path: website.py
          target: /festhub/website.py
        - action: sync
          path: templates
          target: /festhub/templates
        - action: rebuild
          path: festhub.proto
        - action: rebuild
          path: requirements.txt

networks:
  app_net:
    driver: bridge
  db_net:
    driver: bridge

volumes:
  db-data:
