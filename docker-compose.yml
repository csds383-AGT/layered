services:
  db:
    build:
      context: .
      target: db
    environment:
      POSTGRES_USER: festhub
      POSTGRES_PASSWORD: festhub
      POSTGRES_DB: festhub
    ports:
      # ip:port on your machine : port inside the container
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "festhub"]
      interval: 2s
      retries: 15

  # logic and web are placeholders for the gRPC tiers, so they only start with --profile grpc
  logic:
    build:
      context: .
      target: logic
    profiles: [grpc]
    depends_on:
      - db

  web:
    build:
      context: .
      target: web
    profiles: [grpc]
    depends_on:
      - logic

volumes:
  db-data:
