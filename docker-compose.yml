services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: festhub
      POSTGRES_PASSWORD: festhub
      POSTGRES_DB: festhub
    ports:
      # ip:port on your machine : port inside the container
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "festhub"]
      interval: 2s
      retries: 15

volumes:
  db-data:
