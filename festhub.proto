syntax = "proto3";

package festhub;

import "google/protobuf/empty.proto";

// ============================================================
// Service
// ============================================================

service FestHubService {
  // Concerts
  rpc CreateConcert(CreateConcertRequest) returns (IdResponse);
  rpc ShowConcerts(ShowConcertsRequest) returns (ShowConcertsResponse);
  rpc UpdateConcert(UpdateConcertRequest) returns (google.protobuf.Empty);
  rpc DeleteConcert(DeleteConcertRequest) returns (DeleteConcertResponse);

  // Artists
  rpc CreateArtist(CreateArtistRequest) returns (IdResponse);
  rpc ShowArtists(ShowArtistsRequest) returns (ShowArtistsResponse);
  rpc UpdateArtist(UpdateArtistRequest) returns (google.protobuf.Empty);
  rpc DeleteArtist(DeleteArtistRequest) returns (google.protobuf.Empty);

  // Categories
  rpc CreateCategory(CreateCategoryRequest) returns (IdResponse);
  rpc ShowCategories(ShowCategoriesRequest) returns (ShowCategoriesResponse);
  rpc UpdateCategory(UpdateCategoryRequest) returns (google.protobuf.Empty);
  rpc DeleteCategory(DeleteCategoryRequest) returns (google.protobuf.Empty);

  // Media
  rpc CreateMedia(CreateMediaRequest) returns (IdResponse);
  rpc ShowMedia(ShowMediaRequest) returns (ShowMediaResponse);
  rpc UpdateMedia(UpdateMediaRequest) returns (google.protobuf.Empty);
  rpc DeleteMedia(DeleteMediaRequest) returns (google.protobuf.Empty);
}

// ============================================================
// Shared messages
// ============================================================

// Returned by create operations.
message IdResponse {
  string id = 1;
}

// ============================================================
// Concerts
// ============================================================

message Concert {
  string id = 1;
  string name = 2;
  string description = 3;
  int32 available_tickets = 4;

  // Stored in the database as integer cents.
  int64 ticket_price_cents = 5;

  repeated string artist_ids = 6;
  repeated string category_ids = 7;
  repeated string media_ids = 8;
}

message CreateConcertRequest {
  string name = 1;
  string description = 2;
  int32 available_tickets = 3;

  // Decimal string, e.g. "25.50", matching the CLI input.
  string ticket_price = 4;

  // Empty means generate an ID.
  string custom_id = 5;

  repeated string artist_ids = 6;
  repeated string category_ids = 7;
  repeated string media_ids = 8;
}

message ShowConcertsRequest {
  // Empty means show all concerts.
  string id = 1;
}

message ShowConcertsResponse {
  repeated Concert concerts = 1;
}

message UpdateConcertRequest {
  string id = 1;

  // Absent fields remain unchanged.
  optional string name = 2;
  optional string description = 3;
  optional int32 available_tickets = 4;
  optional string ticket_price = 5;

  repeated string add_artist_ids = 6;
  repeated string remove_artist_ids = 7;

  repeated string add_category_ids = 8;
  repeated string remove_category_ids = 9;

  repeated string add_media_ids = 10;
  repeated string remove_media_ids = 11;
}

message DeleteConcertRequest {
  string id = 1;
}

message DeleteConcertResponse {
  // Media deleted through the event's cascade.
  repeated string deleted_media_ids = 1;

  // Categories deleted because no events still use them.
  repeated string deleted_category_ids = 2;
}

// ============================================================
// Artists
// ============================================================

message Artist {
  string id = 1;
  string name = 2;
  string booking_contact = 3;
  repeated string event_ids = 4;
}

message CreateArtistRequest {
  string name = 1;
  string booking_contact = 2;
  string custom_id = 3;
  repeated string event_ids = 4;
}

message ShowArtistsRequest {
  // Empty means show all artists.
  string id = 1;
}

message ShowArtistsResponse {
  repeated Artist artists = 1;
}

message UpdateArtistRequest {
  string id = 1;

  optional string name = 2;
  optional string booking_contact = 3;

  repeated string add_event_ids = 4;
  repeated string remove_event_ids = 5;
}

message DeleteArtistRequest {
  string id = 1;
}

// ============================================================
// Categories
// ============================================================

message Category {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string event_ids = 4;
}

message CreateCategoryRequest {
  string name = 1;
  string description = 2;
  string custom_id = 3;
  repeated string event_ids = 4;
}

message ShowCategoriesRequest {
  // Empty means show all categories.
  string id = 1;
}

message ShowCategoriesResponse {
  repeated Category categories = 1;
}

message UpdateCategoryRequest {
  string id = 1;

  optional string name = 2;
  optional string description = 3;

  repeated string add_event_ids = 4;
  repeated string remove_event_ids = 5;
}

message DeleteCategoryRequest {
  string id = 1;
}

// ============================================================
// Media
// ============================================================

message Media {
  string id = 1;
  string event_id = 2;
  string image_url = 3;
}

message CreateMediaRequest {
  string event_id = 1;
  string image_url = 2;
  string custom_id = 3;
}

message ShowMediaRequest {
  // Empty means show all media assets.
  string id = 1;
}

message ShowMediaResponse {
  repeated Media media = 1;
}

message UpdateMediaRequest {
  string id = 1;

  optional string event_id = 2;
  optional string image_url = 3;
}

message DeleteMediaRequest {
  string id = 1;
}
